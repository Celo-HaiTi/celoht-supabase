name: Validate database infrastructure

on:
  push:
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run validate

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run validate
      - name: Check SQL syntax
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
          create schema auth;
          create schema storage;
          create table auth.users (id uuid primary key);
          create table storage.buckets (id text primary key, name text not null, public boolean not null);
          create table storage.objects (id uuid primary key default gen_random_uuid(), bucket_id text not null, name text not null);
          create function auth.uid() returns uuid language sql stable as 'select null::uuid';
          create function auth.role() returns text language sql stable as 'select ''anon''::text';
          create function storage.foldername(path text) returns text[] language sql immutable as 'select string_to_array(path, ''/'')';
          SQL
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 \
            --command="create role authenticated; create role anon;"
          for migration in $(find . -maxdepth 1 -name '[0-9]*.sql' -printf '%f\n' | sort); do
            psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --file "$migration"
          done
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 \
            --file tests/database.sql